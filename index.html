<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Salon Hub</title>
<style>
  :root {
    --bg: #f6f4f1; --card: #fff; --ink: #1f1d1a; --muted: #77716a; --line: #e6e1da;
    --accent: #8a5a44; --accent-ink: #fff; --danger: #b3261e; --ok: #2e7d4f;
    --radius: 14px; --tabbar: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --card:#1f1d1a; --ink:#f1ede7; --muted:#a29a90; --line:#34302b; --accent:#c98b6b; --accent-ink:#151412; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 8px; font-size:22px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header h1 small { font-size:13px; color:var(--muted); font-weight:500; white-space:nowrap; }
  main { padding: 12px 16px calc(var(--tabbar) + env(safe-area-inset-bottom) + 24px); max-width:760px; margin:0 auto; }
  .row { display:flex; gap:8px; align-items:center; }
  .row.wrap { flex-wrap:wrap; }
  input, select, textarea { width:100%; font:inherit; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0; }
  textarea { min-height:72px; resize:vertical; }
  input[type=checkbox] { width:auto; transform:scale(1.25); margin-right:8px; }
  input[type=color] { padding:2px; height:42px; }
  input[type=date], input[type=time] { -webkit-appearance:none; appearance:none; min-height:42px; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; cursor:pointer;
    background:var(--line); color:var(--ink); white-space:nowrap; }
  button.primary { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  button.link { background:none; padding:0; color:var(--accent); text-decoration:underline; }
  button.back { background:none; padding:4px 0 10px; color:var(--accent); font-weight:600; }
  .list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; display:flex; gap:12px; align-items:center; cursor:pointer; }
  .item .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .item .main { flex:1; min-width:0; }
  .item .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .sub { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .right { color:var(--muted); font-size:14px; text-align:right; flex:none; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--muted); }
  .tag.warn { background:#f6e3c5; color:#7a4b00; }
  .tag.bad { background:#f5d2cf; color:#8c1d16; }
  .tag.good { background:#d5ecdc; color:#1f5c37; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .card h2 { margin:0 0 4px; font-size:17px; }
  .card p { margin:4px 0 12px; color:var(--muted); font-size:14px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; text-align:center; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:13px; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; background:var(--card);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav.tabs button { flex:1; background:none; border-radius:0; height:var(--tabbar); color:var(--muted); padding:0;
    font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  nav.tabs button .ico { font-size:20px; }
  nav.tabs button.active { color:var(--accent); font-weight:600; }
  /* Sheet (modal) */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; display:none; }
  .sheet-bg.open { display:block; }
  .sheet { position:fixed; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; z-index:11;
    background:var(--bg); border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);
    transform:translateY(100%); transition:transform .2s ease; max-width:760px; margin:0 auto; }
  .sheet.open { transform:none; }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
  .sheet-head h2 { margin:0; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .field { margin-bottom:12px; }
  .field label.lbl { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:600; }
  .field .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .field.check label { display:flex; align-items:center; font-size:15px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 10px; }
  .checks { display:flex; flex-wrap:wrap; gap:6px; }
  .checks label { display:flex; align-items:center; background:var(--card); border:1px solid var(--line);
    border-radius:99px; padding:6px 12px; font-size:14px; }
  details.group { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; }
  details.group > summary { list-style:none; cursor:pointer; padding:12px 14px; font-weight:700; display:flex; justify-content:space-between; }
  details.group > summary::-webkit-details-marker { display:none; }
  details.group > summary::after { content:"▾"; color:var(--muted); }
  details.group:not([open]) > summary::after { content:"▸"; }
  details.group > .group-body { padding:0 14px 6px; }
  details.group .hint-top { font-size:12px; color:var(--muted); margin:-4px 0 10px; }
  .wh { display:grid; grid-template-columns:70px minmax(0,1fr) minmax(0,1fr); gap:6px 8px; align-items:center; margin-bottom:12px; }
  .wh label { display:flex; align-items:center; font-size:14px; font-weight:600; }
  .wh input[type=time] { padding:8px; }
  .svc-row { display:grid; grid-template-columns:minmax(0,1fr) 84px 74px; gap:6px; align-items:center; margin-bottom:6px; font-size:14px; }
  .svc-row label { display:flex; align-items:center; }
  .svc-row input[type=number] { padding:8px; }
  .rep-row { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; position:relative; }
  .rep-row .rm { position:absolute; top:6px; right:6px; padding:2px 8px; background:none; color:var(--danger); font-size:18px; }
  .rep-row .field { margin-bottom:8px; }
  .map-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:center; margin-bottom:6px; font-size:14px; }
  .toast { position:fixed; left:50%; bottom:calc(var(--tabbar) + 20px); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; z-index:20;
    font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .notice { font-size:13px; color:var(--muted); background:var(--card); border:1px dashed var(--line);
    border-radius:10px; padding:10px 12px; margin-top:12px; }
  /* Calendar */
  .cal-bar { display:grid; grid-template-columns:44px minmax(0,1fr) 44px auto; gap:6px; align-items:center; }
  .cal-bar button { padding:10px 0; }
  .cal-bar .today { padding:10px 12px; }
  .cal-day { font-size:18px; font-weight:700; margin:14px 0 2px; }
  .cal-sum { color:var(--muted); font-size:14px; margin-bottom:8px; }
  .appt { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line); border-radius:12px;
    padding:10px 12px; display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:10px; cursor:pointer; margin-bottom:8px; }
  .appt .time { font-weight:700; font-size:14px; line-height:1.3; }
  .appt .time small { display:block; color:var(--muted); font-weight:500; }
  .appt .who { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .appt .what { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .appt.cancelled { opacity:.55; }
  .appt.cancelled .who { text-decoration:line-through; }
  .on-today { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 10px; font-size:13px; }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .more-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .more-grid .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; }
  .more-grid .tile .ico { font-size:24px; }
  .more-grid .tile b { display:block; margin-top:6px; }
  .more-grid .tile span { color:var(--muted); font-size:13px; }
  .history .h-row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer; }
  .history .h-row:last-child { border-bottom:0; }
</style>
</head>
<body>
<header>
  <h1><span id="salonName">Salon Hub</span> <small id="tabTitle"></small></h1>
  <div class="row" id="toolbar">
    <input id="search" type="search" placeholder="Search…" autocomplete="off">
    <button class="primary" id="addBtn">+ Add</button>
  </div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="calendar"><span class="ico">📅</span>Calendar</button>
  <button data-tab="clients"><span class="ico">👤</span>Clients</button>
  <button data-tab="staff"><span class="ico">✂️</span>Staff</button>
  <button data-tab="services"><span class="ico">📋</span>Services</button>
  <button data-tab="more"><span class="ico">☰</span>More</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" hidden>

<script>
"use strict";
/* =====================================================================
   SCHEMA — every table, field and form is driven from this.
   When we move to a hosted database, these map 1:1 to table columns.
   ===================================================================== */
const ROLES = ["Stylist","Colorist","Barber","Nail Tech","Esthetician","Assistant","Front Desk","Manager","Owner"];
const PAY_TYPES = ["Commission","Hourly","Hourly + Commission","Booth Rent","Salary"];
const LEVELS = ["Apprentice","New talent","Stylist","Senior","Master","Educator","Owner"];
const APPT_STATUSES = ["Booked","Confirmed","Checked in","Completed","No-show","Cancelled"];
const DAYS = [["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"]];
const DAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];
const COMPLEX_TYPES = new Set(["multiref","services_offered","weekly_hours","repeater"]);
const PALETTE = ["#8a5a44","#3f6e8c","#6b8e4e","#a8577e","#c28a2c","#5b5fa8","#3d8a80","#b0533c"];
const serviceOptions = () => DB.list("services").sort(SCHEMA.services.sort).map(s => ({ value: s.id, label: s.name + (s.price !== "" && s.price != null ? ` (${money(s.price)})` : "") }));

const SCHEMA = {
  clients: {
    label: "Clients", singular: "Client",
    fields: [
      { section: "Contact" },
      { key:"first_name", label:"First name", type:"text", required:true, half:true },
      { key:"last_name",  label:"Last name",  type:"text", half:true },
      { key:"phone",      label:"Mobile phone", type:"tel", half:true },
      { key:"email",      label:"Email", type:"email", half:true },
      { key:"birthday",   label:"Birthday", type:"date", half:true },
      { key:"preferred_staff_id", label:"Preferred stylist", type:"ref", ref:"staff", half:true },
      { section: "Service notes" },
      { key:"allergies",     label:"Allergies / sensitivities", type:"textarea", hint:"Patch-test results, product reactions, etc." },
      { key:"formula_notes", label:"Color formulas", type:"textarea" },
      { key:"notes",         label:"General notes", type:"textarea" },
      { section: "Membership" },
      { key:"membership_id",    label:"Membership plan", type:"ref", ref:"memberships", half:true },
      { key:"membership_start", label:"Member since", type:"date", half:true },
      { section: "Communication" },
      { key:"sms_opt_in",   label:"OK to text (reminders/marketing)", type:"checkbox" },
      { key:"email_opt_in", label:"OK to email", type:"checkbox" },
      { section: "Migration" },
      { key:"external_id", label:"ID in old booking system", type:"text", hint:"Lets us match records when we merge history from the current platform." },
    ],
    title: r => fullName(r) || "(no name)",
    sub: r => [fmtPhone(r.phone), r.email].filter(Boolean).join(" · "),
    right: r => { const s = DB.get("staff", r.preferred_staff_id); return s ? staffName(s) : ""; },
    dot: r => DB.get("staff", r.preferred_staff_id)?.calendar_color,
    sort: (a,b) => (a.last_name||"").localeCompare(b.last_name||"") || (a.first_name||"").localeCompare(b.first_name||""),
    searchText: r => [r.first_name,r.last_name,r.phone,digits(r.phone),r.email,r.external_id].join(" "),
    refLabel: r => fullName(r) + (r.phone ? " · " + fmtPhone(r.phone) : ""),
  },
  staff: {
    label: "Staff", singular: "Team member",
    fields: [
      { section: "Profile" },
      { key:"first_name",   label:"First name", type:"text", required:true, half:true },
      { key:"last_name",    label:"Last name",  type:"text", half:true },
      { key:"display_name", label:"Name shown to clients", type:"text", half:true, hint:"Optional, e.g. “Jess R.”" },
      { key:"pronouns",     label:"Pronouns", type:"text", half:true },
      { key:"role",         label:"Role", type:"select", options:ROLES, half:true },
      { key:"level",        label:"Stylist level", type:"select", options:LEVELS, half:true, hint:"Used for level-based pricing." },
      { key:"phone",        label:"Mobile phone", type:"tel", half:true },
      { key:"email",        label:"Email", type:"email", half:true },
      { key:"birthday",     label:"Birthday", type:"date", half:true },
      { key:"calendar_color", label:"Calendar color", type:"color", half:true },
      { key:"active",       label:"Currently active", type:"checkbox", default:true },

      { section: "Online booking profile", hint: "What clients will see on the booking page." },
      { key:"bookable_online", label:"Clients can book online with this person", type:"checkbox", default:true },
      { key:"bio",          label:"Bio", type:"textarea" },
      { key:"specialties",  label:"Specialties", type:"text", hint:"e.g. Balayage, curly cuts, extensions" },
      { key:"instagram",    label:"Instagram handle", type:"text", half:true },
      { key:"photo_url",    label:"Photo link", type:"url", half:true },

      { section: "Services & pricing", hint: "Tick what they perform. Leave price/time blank to use the menu default." },
      { key:"services_offered", label:"", type:"services_offered" },

      { section: "Weekly schedule", hint: "Regular working hours. Used for the booking calendar." },
      { key:"weekly_hours", label:"", type:"weekly_hours" },
      { key:"time_off", label:"Time off", type:"repeater", addLabel:"+ Add time off", subfields:[
        { key:"start", label:"From", type:"date", half:true }, { key:"end", label:"To", type:"date", half:true },
        { key:"reason", label:"Reason", type:"select", options:["Vacation","Sick","Personal","Education","Other"], half:true },
        { key:"note", label:"Note", type:"text", half:true } ] },

      { section: "Pay structure" },
      { key:"pay_type",       label:"Pay type", type:"select", options:PAY_TYPES },
      { key:"commission_pct", label:"Service commission %", type:"number", step:"0.5", half:true, showIf: r => /Commission/.test(r.pay_type||"") },
      { key:"product_commission_pct", label:"Retail commission %", type:"number", step:"0.5", half:true, showIf: r => /Commission/.test(r.pay_type||"") },
      { key:"backbar_fee_pct", label:"Product/backbar fee %", type:"number", step:"0.5", half:true, showIf: r => /Commission/.test(r.pay_type||""), hint:"Deducted from service sales before commission, if you use one." },
      { key:"hourly_rate",    label:"Hourly rate ($)", type:"number", step:"0.01", half:true, showIf: r => /Hourly/.test(r.pay_type||"") },
      { key:"booth_rent_weekly", label:"Booth rent per week ($)", type:"number", step:"0.01", half:true, showIf: r => r.pay_type === "Booth Rent" },
      { key:"salary_annual",  label:"Annual salary ($)", type:"number", step:"1", half:true, showIf: r => r.pay_type === "Salary" },
      { key:"tip_payout",     label:"Card tips paid out", type:"select", options:["With payroll","Daily","Weekly"], half:true, showIf: r => r.pay_type !== "Booth Rent" },

      { section: "Employment" },
      { key:"employment_type", label:"Classification", type:"select", options:["W-2 employee","1099 contractor","Booth renter"], half:true },
      { key:"hours_type",   label:"Full / part time", type:"select", options:["Full time","Part time"], half:true },
      { key:"start_date",   label:"Start date", type:"date", half:true },
      { key:"end_date",     label:"End date", type:"date", half:true },
      { key:"reviews", label:"Reviews & check-ins", type:"repeater", addLabel:"+ Add review", subfields:[
        { key:"date", label:"Date", type:"date", half:true }, { key:"type", label:"Type", type:"select", options:["90-day","Annual","Level-up","Check-in","Write-up"], half:true },
        { key:"note", label:"Notes", type:"textarea" } ] },

      { section: "License & certifications" },
      { key:"license_type",   label:"License type", type:"select", options:["Cosmetology","Barber","Esthetician","Nail technician","Apprentice / trainee","Instructor"], half:true },
      { key:"license_state",  label:"State", type:"text", half:true },
      { key:"license_number", label:"License number", type:"text", half:true },
      { key:"license_expires", label:"Expires", type:"date", half:true, hint:"Flags the stylist 60 days before expiry." },
      { key:"certifications", label:"Certifications & education", type:"repeater", addLabel:"+ Add certification", subfields:[
        { key:"name", label:"Name", type:"text" },
        { key:"date", label:"Completed", type:"date", half:true }, { key:"expires", label:"Expires", type:"date", half:true } ] },

      { section: "Emergency contact" },
      { key:"ec_name",     label:"Name", type:"text", half:true },
      { key:"ec_relation", label:"Relationship", type:"text", half:true },
      { key:"ec_phone",    label:"Phone", type:"tel" },

      { section: "Onboarding checklist", hint: "Tick when it's on file. Keep the documents themselves with payroll or in a locked file, not here." },
      { key:"doc_w4",       label:"W-4 / W-9 on file", type:"checkbox" },
      { key:"doc_i9",       label:"I-9 completed", type:"checkbox" },
      { key:"doc_license_copy", label:"Copy of license on file", type:"checkbox" },
      { key:"doc_handbook", label:"Handbook signed", type:"checkbox" },
      { key:"doc_agreement", label:"Employment / rental agreement signed", type:"checkbox" },
      { key:"doc_direct_deposit", label:"Direct deposit set up with payroll", type:"checkbox" },

      { section: "Other" },
      { key:"notes",       label:"Notes", type:"textarea" },
      { key:"external_id", label:"ID in old system", type:"text" },
    ],
    title: r => staffName(r),
    sub: r => [r.role, r.level, r.pay_type].filter(Boolean).join(" · "),
    right: r => {
      if (r.active === false) return '<span class="tag">Inactive</span>';
      const d = r.license_expires ? (new Date(r.license_expires) - new Date()) / 864e5 : Infinity;
      if (d < 0) return '<span class="tag bad">License expired</span>';
      if (d < 60) return '<span class="tag warn">License expiring</span>';
      return "";
    },
    rightIsHtml: true,
    dot: r => r.calendar_color,
    sort: (a,b) => (b.active!==false) - (a.active!==false) || (a.first_name||"").localeCompare(b.first_name||""),
    searchText: r => [r.first_name,r.last_name,r.display_name,r.role,r.level,r.specialties,r.email,r.phone].join(" "),
  },
  services: {
    label: "Services", singular: "Service",
    fields: [
      { key:"name",         label:"Service name", type:"text", required:true },
      { key:"category",     label:"Category", type:"text", list:"categoryList", hint:"e.g. Cut, Color, Treatment, Nails" },
      { key:"duration_min", label:"Duration (minutes)", type:"number", step:"5", half:true },
      { key:"price",        label:"Price ($)", type:"number", step:"0.01", half:true },
      { key:"price_from",   label:"Price is a starting price (“from $…”)", type:"checkbox" },
      { key:"processing_min", label:"Processing time (min)", type:"number", step:"5", half:true, hint:"Time the stylist is free mid-service (e.g. color processing)." },
      { key:"active",       label:"Offered / bookable", type:"checkbox", default:true },
      { key:"description",  label:"Description", type:"textarea" },
      { key:"external_id",  label:"ID in old system", type:"text" },
    ],
    title: r => r.name || "(unnamed)",
    sub: r => [r.category, r.duration_min ? r.duration_min + " min" : ""].filter(Boolean).join(" · "),
    right: r => r.price !== undefined && r.price !== "" ? (r.price_from ? "from " : "") + money(r.price) : "",
    sort: (a,b) => (a.category||"").localeCompare(b.category||"") || (a.name||"").localeCompare(b.name||""),
    searchText: r => [r.name, r.category, r.description].join(" "),
  },
  appointments: {
    label: "Appointments", singular: "Appointment",
    fields: [
      { section: "Appointment" },
      { key:"date",       label:"Date", type:"date", required:true, half:true },
      { key:"start_time", label:"Start time", type:"time", required:true, half:true },
      { key:"client_id",  label:"Client", type:"refsearch", ref:"clients", required:true, hint:"Start typing a name or phone. A new name creates a new client." },
      { key:"staff_id",   label:"Stylist", type:"ref", ref:"staff", required:true, half:true },

/* =====================================================================
   DATA LAYER — the ONLY place that touches storage.
   Today: this browser's localStorage. Next: a hosted database with
   logins; only this block changes.
   ===================================================================== */
const STORAGE_KEY = "salonhub.v1";
const TABLES = Object.keys(SCHEMA).filter(t => t !== "settings");
const DB = (() => {
  let data;
  function blank() { return { meta: { schema_version: 3, created_at: now() }, settings: {} }; }
  function load() {
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || blank(); }
    catch (e) { data = blank(); }
    for (const t of TABLES) data[t] = data[t] || [];
    data.meta = data.meta || blank().meta;
    data.settings = data.settings || {};
    // migrations
    for (const s of data.staff) if (Array.isArray(s.service_ids) && !s.services_offered) {
      s.services_offered = s.service_ids.map(id => ({ service_id: id })); delete s.service_ids;
    }
    if (data.meta.salon_name && !data.settings.salon_name) { data.settings.salon_name = data.meta.salon_name; delete data.meta.salon_name; }
    data.meta.schema_version = 3;
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
    catch (e) { toast("⚠️ Couldn't save — storage is full or blocked"); return false; }
  }
  load();
  return {
    list: t => data[t].slice(),
    get: (t, id) => id ? data[t].find(r => r.id === id) : undefined,
    upsert(t, rec) {
      const i = data[t].findIndex(r => r.id === rec.id);
      if (i >= 0) data[t][i] = { ...data[t][i], ...rec, updated_at: now() };
      else { rec = { ...rec, id: rec.id || uid(), created_at: now(), updated_at: now() }; data[t].push(rec); }
      persist(); return rec.id;
    },
    bulkInsert(t, recs) { for (const r of recs) data[t].push({ id: uid(), ...r, created_at: now(), updated_at: now() }); persist(); },
    remove(t, id) { data[t] = data[t].filter(r => r.id !== id); persist(); },
    meta: () => data.meta,
    setMeta(k, v) { data.meta[k] = v; persist(); },
    settings: () => data.settings,
    saveSettings(s) { data.settings = { ...data.settings, ...s, updated_at: now() }; persist(); },
    exportAll: () => JSON.parse(JSON.stringify({ ...data, meta: { ...data.meta, exported_at: now() } })),
    replaceAll(obj) {
      if (!obj || typeof obj !== "object" || !Array.isArray(obj.clients)) throw new Error("Not a Salon Hub backup file");
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); load(); persist();
    },
    wipe() { localStorage.removeItem(STORAGE_KEY); load(); persist(); },
  };
})();

/* ===================== helpers ===================== */
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function now() { return new Date().toISOString(); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function digits(s) { return String(s || "").replace(/\D/g, ""); }
function phoneKey(s) { const d = digits(s); return d.length >= 10 ? d.slice(-10) : d; }
function fmtPhone(s) { const d = phoneKey(s); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (s || ""); }
function money(n) { if (n === "" || n == null) return ""; const v = Number(n); return isNaN(v) ? "" : "$" + v.toFixed(v % 1 ? 2 : 0); }
function fullName(r) { return [r.first_name, r.last_name].filter(Boolean).join(" "); }
function staffName(r) { return r.display_name || fullName(r) || "(no name)"; }
function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function num(v) { return v === "" || v == null || isNaN(Number(v)) ? "" : Number(v); }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function $(s, root = document) { return root.querySelector(s); }
function $$(s, root = document) { return [...root.querySelectorAll(s)]; }
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function localISO(d) { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }
function today() { return localISO(new Date()); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return localISO(d); }
function dayKey(iso) { return DAY_KEYS[new Date(iso + "T12:00:00").getDay()]; }
function fmtDate(iso, long) { if (!iso) return ""; return new Date(iso + "T12:00:00").toLocaleDateString(undefined, long ? { weekday:"long", month:"long", day:"numeric" } : { month:"short", day:"numeric", year:"numeric" }); }
function fmtTime(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; }
function addMin(t, n) { const [h, m] = t.split(":").map(Number); const x = h * 60 + m + Number(n || 0); return `${String(Math.floor(x / 60) % 24).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; }
function serviceNames(a) { return (a.services || []).map(l => DB.get("services", l.service_id)?.name).filter(Boolean).join(", "); }
function nextSlot() { const d = new Date(); return `${String(Math.min(d.getHours() + 1, 23)).padStart(2, "0")}:00`; }

/* ===================== Calendar ===================== */
function staffWorking(s, iso) {
  if (s.active === false) return null;
  const wh = (s.weekly_hours || {})[dayKey(iso)] || {};
  if (!(wh.on ?? dayKey(iso) !== "sun")) return null;
  if ((s.time_off || []).some(t => t.start && t.start <= iso && (t.end || t.start) >= iso)) return "off";
  return `${fmtTime(wh.start || "09:00")}–${fmtTime(wh.end || "17:00")}`;
}

  const live = appts.filter(a => !["Cancelled","No-show"].includes(a.status));
  const booked = live.reduce((s, a) => s + (Number(a.total_price) || 0), 0);
  const working = staff.filter(s => !calStaff || s.id === calStaff).map(s => ({ s, w: staffWorking(s, calDate) })).filter(x => x.w);
  $("#view").innerHTML = `
    <div class="cal-bar">
      <button onclick="calDate=addDays(calDate,-1);render()">‹</button>
      <input type="date" id="calPick" value="${calDate}">
      <button onclick="calDate=addDays(calDate,1);render()">›</button>

    </div>
    <div style="margin-top:8px"><select id="calStaffSel"><option value="">All stylists</option>${staff.filter(s => s.active !== false).map(s => `<option value="${esc(s.id)}" ${s.id === calStaff ? "selected" : ""}>${esc(staffName(s))}</option>`).join("")}</select></div>
    <div class="cal-day">${esc(fmtDate(calDate, true))}${calDate === today() ? ' <span class="tag good">Today</span>' : ""}</div>
    <div class="cal-sum">${live.length} appointment${live.length === 1 ? "" : "s"}${booked ? ` · ${money(booked)} booked` : ""}${bh && bh.on ? ` · Open ${fmtTime(bh.start)}–${fmtTime(bh.end)}` : ""}</div>
    ${salonClosed ? `<div class="notice">🚪 Salon closed${closure ? `: ${esc(closure.name || "")}` : " (business hours)"}</div>` : ""}
    ${working.length ? `<div class="on-today">${working.map(({ s, w }) => `<span class="chip"><i style="background:${esc(s.calendar_color || "var(--line)")}"></i>${esc(staffName(s))} · ${w === "off" ? "Time off" : esc(w)}</span>`).join("")}</div>` : ""}
    ${appts.length ? appts.map(a => {
      const s = DB.get("staff", a.staff_id), cancelled = ["Cancelled","No-show"].includes(a.status);
      const tagCls = a.status === "Completed" ? " good" : cancelled ? " bad" : a.status === "Checked in" ? " warn" : "";
      return `<div class="appt${cancelled ? " cancelled" : ""}" data-id="${esc(a.id)}" style="border-left-color:${esc(s?.calendar_color || "var(--line)")}">

function prepareAppointment(a) {
  // Create a client on the fly if a new name was typed
  if (!a.client_id && a.client_id__text) {
    const txt = a.client_id__text.split("·")[0].trim(), parts = txt.split(/\s+/);
    const phone = digits(txt).length >= 7 ? txt : "";
    a.client_id = DB.upsert("clients", phone ? { first_name: "New client", phone } : { first_name: parts[0], last_name: parts.slice(1).join(" ") });
    toast("New client added");
  }
  delete a.client_id__text;
  const staff = DB.get("staff", a.staff_id);
  a.services = (a.services || []).filter(l => l.service_id).map(l => {
    const svc = DB.get("services", l.service_id) || {}, off = (staff?.services_offered || []).find(o => o.service_id === l.service_id) || {};
    const pick = (...v) => { for (const x of v) if (x !== "" && x != null) return Number(x); return ""; };
    return { service_id: l.service_id, price: pick(l.price, off.price, svc.price), duration_min: pick(l.duration_min, off.duration_min, svc.duration_min) };
  });
  const dur = a.services.reduce((s, l) => s + (Number(l.duration_min) || 0), 0) || 30;
  a.duration_min = dur;
  if (a.start_time) a.end_time = addMin(a.start_time, dur);
  if (a.total_price === "" && a.services.length) a.total_price = a.services.reduce((s, l) => s + (Number(l.price) || 0), 0);
}

/* ===================== forms (generated from SCHEMA) ===================== */
function openSheet(html) { $("#sheet").innerHTML = html; $("#sheetBg").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0; }
function closeSheet() { $("#sheetBg").classList.remove("open"); $("#sheet").classList.remove("open"); }
const refMaps = {};

function fieldHtml(f, rec) {
  const v = rec[f.key] ?? (rec.id ? "" : f.default ?? "");
  const id = "f_" + f.key, req = f.required ? " required" : "";
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
  const wrapStart = `<div class="field${f.type === "checkbox" ? " check" : ""}" data-key="${f.key}">`;
  const lbl = f.label ? `<label class="lbl" for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>` : "";
  switch (f.type) {
    case "textarea": return `${wrapStart}${lbl}<textarea id="${id}" name="${f.key}">${esc(v)}</textarea>${hint}</div>`;
    case "checkbox": return `${wrapStart}<label><input type="checkbox" id="${id}" name="${f.key}" ${(rec[f.key] ?? f.default) ? "checked" : ""}>${esc(f.label)}</label>${hint}</div>`;
    case "select": return `${wrapStart}${lbl}<select id="${id}" name="${f.key}"><option value="">—</option>${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${hint}</div>`;
    case "ref": {
      const S = SCHEMA[f.ref], opts = DB.list(f.ref).filter(r => r.active !== false || r.id === v).sort(S.sort);
      return `${wrapStart}${lbl}<select id="${id}" name="${f.key}"><option value="">— none —</option>${opts.map(o => `<option value="${esc(o.id)}" ${o.id === v ? "selected" : ""}>${esc(S.title(o))}</option>`).join("")}</select>${hint}</div>`;
    }
    case "refsearch": {
      const S = SCHEMA[f.ref], label = S.refLabel || S.title, map = refMaps[f.key] = {};
      const opts = DB.list(f.ref).sort(S.sort).map(o => { const l = label(o); map[l] = o.id; return l; });
      const cur = DB.get(f.ref, v);
      return `${wrapStart}${lbl}<input id="${id}" name="${f.key}__label" list="dl_${f.key}" autocomplete="off" value="${esc(cur ? label(cur) : "")}" placeholder="Name or phone">
        <datalist id="dl_${f.key}">${opts.map(o => `<option value="${esc(o)}">`).join("")}</datalist>${hint}</div>`;
    }
    case "services_offered": {
      const offered = Object.fromEntries((rec[f.key] || []).map(o => [o.service_id, o]));
      const svcs = DB.list("services").sort(SCHEMA.services.sort);
      if (!svcs.length) return `${wrapStart}<div class="hint">Add your service menu in the Services tab, then come back to assign services.</div></div>`;
      return `${wrapStart}<div class="svc-row" style="color:var(--muted);font-size:12px;font-weight:700"><span>Service</span><span>Price $</span><span>Min</span></div>
        ${svcs.map(s => { const o = offered[s.id]; return `<div class="svc-row" data-svc="${esc(s.id)}">
          <label><input type="checkbox" class="svc-on" ${o ? "checked" : ""}>${esc(s.name)}</label>
          <input type="number" class="svc-price" step="0.01" inputmode="decimal" placeholder="${esc(s.price ?? "")}" value="${esc(o?.price ?? "")}">
          <input type="number" class="svc-dur" step="5" inputmode="numeric" placeholder="${esc(s.duration_min ?? "")}" value="${esc(o?.duration_min ?? "")}">
        </div>`; }).join("")}</div>`;
    }
    case "weekly_hours": {
      const wh = rec[f.key] || {};
      return `${wrapStart}<div class="wh">${DAYS.map(([d, name]) => { const x = wh[d] || {}; const on = x.on ?? d !== "sun";
        return `<label><input type="checkbox" data-day="${d}" class="wh-on" ${on ? "checked" : ""}>${name}</label>
          <input type="time" data-day="${d}" class="wh-start" value="${esc(x.start || "09:00")}">
          <input type="time" data-day="${d}" class="wh-end" value="${esc(x.end || "17:00")}">`; }).join("")}</div></div>`;
    }
    case "repeater": {
      repeaterDefs[f.key] = f;
      let rows = rec[f.key] || [];
      if (!rows.length && !rec.id && f.startWithRow) rows = [{}];
      return `${wrapStart}${lbl}<div class="rep-list">${rows.map(r => repRowHtml(f, r)).join("")}</div>
        <button type="button" onclick="addRepRow('${f.key}', this)">${esc(f.addLabel || "+ Add")}</button>${hint}</div>`;
    }
    default: {
      const extra = (f.step ? ` step="${f.step}" inputmode="decimal"` : "") + (f.list ? ` list="${f.list}"` : "");
      const val = f.type === "color" && !v ? PALETTE[DB.list("staff").length % PALETTE.length] : v;
      return `${wrapStart}${lbl}<input id="${id}" name="${f.key}" type="${f.type}" value="${esc(val)}"${req}${extra}>${hint}</div>`;
    }
  }
}

function repRowHtml(f, row = {}) {
  const inner = layoutFields(f.subfields.map(s => ({ ...s, _sub: true })), row, true);
  return `<div class="rep-row">${inner}<button type="button" class="rm" onclick="this.parentElement.remove()" aria-label="Remove">×</button></div>`;
}
function addRepRow(key, btn) {
  btn.previousElementSibling.insertAdjacentHTML("beforeend", repRowHtml(repeaterDefs[key], {}));
}
const repeaterDefs = {};
// Sub-fields inside repeater rows use data-sub instead of name, so they don't collide across rows.
function subFieldHtml(f, row) {
  const v = row[f.key] ?? "";
  let input;
  if (f.type === "select") {
    const opts = typeof f.options === "function" ? f.options() : f.options.map(o => ({ value: o, label: o }));
    input = `<select data-sub="${f.key}"><option value="">—</option>${opts.map(o => `<option value="${esc(o.value)}" ${o.value === v ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
  }
  else if (f.type === "textarea") input = `<textarea data-sub="${f.key}">${esc(v)}</textarea>`;
  else input = `<input data-sub="${f.key}" type="${f.type}" value="${esc(v)}"${f.type === "number" ? ' inputmode="decimal" step="any"' : ""}>`;
  return `<div class="field"><label class="lbl">${esc(f.label)}</label>${input}</div>`;
}

// Fields grouped into collapsible sections; consecutive half-width fields share a row.
function layoutFields(fields, rec, flat = false) {
  let out = "", buf = [], groupOpen = false, gi = 0;
  const flush = () => { if (buf.length) { out += `<div class="grid2">${buf.join("")}</div>`; buf = []; } };
  for (const f of fields) {
    if (f.section) {
      if (flat) continue;
      flush(); if (groupOpen) out += `</div></details>`;
      const open = !rec.id || gi === 0; gi++;
      out += `<details class="group"${open ? " open" : ""}><summary>${esc(f.section)}</summary><div class="group-body">${f.hint ? `<div class="hint-top">${esc(f.hint)}</div>` : ""}`;
      groupOpen = true; continue;
    }
    const h = f._sub ? subFieldHtml(f, rec) : fieldHtml(f, rec);
    if (f.half) buf.push(h); else { flush(); out += h; }
  }
  flush(); if (groupOpen) out += `</div></details>`;
  return out;
}

function readForm(t, form) {
  const rec = {};
  for (const f of SCHEMA[t].fields) {
    if (!f.key) continue;
    const box = $(`.field[data-key="${f.key}"]`, form);
    if (f.type === "checkbox") rec[f.key] = !!form.elements[f.key]?.checked;
    else if (f.type === "number") rec[f.key] = num(form.elements[f.key]?.value);
    else if (f.type === "refsearch") {
      const txt = (form.elements[f.key + "__label"]?.value || "").trim();
      rec[f.key] = (refMaps[f.key] || {})[txt] || "";
      if (!rec[f.key] && txt) rec[f.key + "__text"] = txt;
    }
    else if (f.type === "services_offered") {
      rec[f.key] = $$(`.svc-row[data-svc]`, box || form).filter(r => $(".svc-on", r).checked)
        .map(r => ({ service_id: r.dataset.svc, price: num($(".svc-price", r).value), duration_min: num($(".svc-dur", r).value) }));
    }
    else if (f.type === "weekly_hours") {
      rec[f.key] = {};
      for (const [d] of DAYS) rec[f.key][d] = { on: $(`.wh-on[data-day="${d}"]`, box).checked, start: $(`.wh-start[data-day="${d}"]`, box).value, end: $(`.wh-end[data-day="${d}"]`, box).value };
    }
    else if (f.type === "repeater") {
      const numKeys = new Set(f.subfields.filter(s => s.type === "number").map(s => s.key));
      rec[f.key] = $$(".rep-row", box).map(row => Object.fromEntries($$("[data-sub]", row).map(i => [i.dataset.sub, numKeys.has(i.dataset.sub) ? num(i.value) : i.value.trim()])))
        .filter(o => Object.values(o).some(x => x !== ""));
    }
    else rec[f.key] = (form.elements[f.key]?.value ?? "").trim();
  }
  return rec;
}

function applyShowIf(t, form) {
  const cur = readForm(t, form);
  for (const f of SCHEMA[t].fields) if (f.showIf) { const el = $(`.field[data-key="${f.key}"]`, form); if (el) el.style.display = f.showIf(cur) ? "" : "none"; }
}

    if (t === "services") DB.list("staff").filter(s => (s.services_offered || []).some(o => o.service_id === id)).forEach(s => DB.upsert("staff", { ...s, services_offered: s.services_offered.filter(o => o.service_id !== id) }));
    closeSheet(); render(); toast("Deleted");
  };

/* ===================== CSV ===================== */
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split("\n")[0];
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function toCsv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n"); }

  price: ["price","cost","amount","serviceprice","rate"],
  sms_opt_in: ["smsoptin","textoptin","acceptssms","smsmarketing","textmarketing"],
  email_opt_in: ["emailoptin","acceptsemail","emailmarketing","marketingemail"],
  preferred_staff_id: ["preferredstaff","preferredstylist","stylist","provider","preferredprovider"],
  // appointments
  date: ["date","appointmentdate","visitdate","servicedate","bookingdate"],
  start_time: ["time","starttime","appointmenttime","start"],
  client_id: ["client","customer","clientname","customername","guest","clientphone","clientid","customerid"],
  staff_id: ["staff","stylist","provider","employee","staffname","stylistname","providername","teammember"],
  _service: ["service","services","servicename","item","items"],
  total_price: ["total","price","amount","sales","revenue","totalprice","servicetotal"],
  status: ["status","appointmentstatus","state"],
  // products
  brand: ["brand","manufacturer","vendor"],
  sku: ["sku","barcode","upc","itemcode"],
  retail_price: ["retailprice","price","retail","sellprice"],
  stock_qty: ["stock","qty","quantity","onhand","instock","inventory"],
  supplier: ["supplier","distributor"],
  // gift cards
  code: ["code","cardcode","giftcardcode","cardnumber","number"],
  balance: ["balance","remaining","remainingbalance","currentbalance"],
  amount: ["amount","originalamount","value","initialvalue"],
  recipient_name: ["recipient","recipientname","to"],
  issued: ["issued","issuedate","purchasedate","created","sold"],
  expires: ["expires","expiration","expirationdate","expirydate"],
};
function importableFields(t) {
  const base = SCHEMA[t].fields.filter(f => f.key && !COMPLEX_TYPES.has(f.type)).map(f => ({ key: f.key, label: f.label }));
  if (t === "clients" || t === "staff") base.unshift({ key: "_full_name", label: "Full name (split into first/last)" });
  if (t === "appointments") base.splice(4, 0, { key: "_service", label: "Service(s) (by name)" });
  return base;
}
function guessField(t, header, used) {
  const h = norm(header), fields = importableFields(t).filter(f => !used.has(f.key));
  const direct = fields.find(f => norm(f.key) === h || norm(f.label) === h);
  if (direct) return direct.key;
  for (const f of fields) if ((ALIASES[f.key] || []).includes(h)) return f.key;
  return "";
}
function toIsoDate(s) {
  s = String(s || "").trim(); if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
  if (m) { let y = m[3] ? +m[3] : 1900; if (y < 100) y += y > 30 ? 1900 : 2000; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; }
  const d = new Date(s); return isNaN(d) ? "" : localISO(d);
}
function toTime(s) {
  const m = String(s || "").trim().match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?m?\.?/i); if (!m) return "";
  let h = +m[1]; const min = m[2] || "00", ap = (m[3] || "").toLowerCase();
  if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0;
  return h > 23 ? "" : `${String(h).padStart(2, "0")}:${min}`;
}
function truthy(s) { return /^(y|yes|true|1|x|opted ?in|subscribed)$/i.test(String(s).trim()); }
function matchOption(options, v) { const n = norm(v); return options.find(o => norm(o) === n) || options.find(o => n && norm(o).startsWith(n.slice(0, 4))) || ""; }

// Find a record in another table by name, phone, email, code or old-system ID.
function makeResolver(table) {
  const idx = {};
  const add = (k, id) => { if (k && !(k in idx)) idx[k] = id; };
  for (const r of DB.list(table)) {
    add("x:" + norm(r.external_id), r.id);
    if (r.phone) add("p:" + phoneKey(r.phone), r.id);
    if (r.email) add("e:" + r.email.toLowerCase(), r.id);
    add("n:" + norm(SCHEMA[table].title(r)), r.id);
    add("n:" + norm(fullName(r)), r.id);
    add("n:" + norm(r.display_name), r.id);
    add("n:" + norm(r.name), r.id);
    if (table === "staff") add("n:" + norm(r.first_name), r.id);
  }
  delete idx["x:"]; delete idx["n:"];
  return v => { v = String(v || "").trim(); if (!v) return "";
    return idx["x:" + norm(v)] || (phoneKey(v).length === 10 && idx["p:" + phoneKey(v)]) || idx["e:" + v.toLowerCase()] || idx["n:" + norm(v)] || ""; };
}

function pickCsv(t) { pickFile(".csv,.tsv,.txt,text/csv", text => showImport(t, parseCsv(text))); }

function showImport(t, rows) {
  if (rows.length < 2) return toast("No rows found in that file");
  const headers = rows[0], body = rows.slice(1), fields = importableFields(t), used = new Set();
  const guesses = headers.map(h => { const g = guessField(t, h, used); if (g) used.add(g); return g; });
  const opts = sel => `<option value="">— skip —</option>` + fields.map(f => `<option value="${f.key}" ${f.key === sel ? "selected" : ""}>${esc(f.label)}</option>`).join("");
  openSheet(`<div class="sheet-head"><button onclick="closeSheet()">Cancel</button><h2>Import ${SCHEMA[t].label.toLowerCase()}</h2><button class="primary" id="doImport">Import</button></div>
    <p class="hint" style="color:var(--muted)">${body.length} rows found. Match each column in your file to a Salon Hub field.</p>
    <div class="map-row" style="font-weight:700;color:var(--muted)"><span>Your column (example)</span><span>Salon Hub field</span></div>
    ${headers.map((h, i) => `<div class="map-row"><span><b>${esc(h)}</b><br><small style="color:var(--muted)">${esc((body.find(r => r[i]) || [])[i] || "")}</small></span><select data-col="${i}">${opts(guesses[i])}</select></div>`).join("")}
    ${t === "clients" ? `<div class="field check" style="margin-top:12px"><label><input type="checkbox" id="skipDupes" checked>Skip clients whose phone or email already exists</label></div>` : ""}
    ${t === "appointments" ? `<div class="field check" style="margin-top:12px"><label><input type="checkbox" id="mkClients" checked>Create clients that aren't in Salon Hub yet</label></div>` : ""}`);
  $("#doImport").onclick = () => runImport(t, body);
}

function runImport(t, body) {
  const map = $$("select[data-col]").map(s => ({ col: +s.dataset.col, key: s.value })).filter(m => m.key);
  if (!map.length) return toast("Match at least one column");
  const F = Object.fromEntries(SCHEMA[t].fields.filter(f => f.key).map(f => [f.key, f]));
  const resolvers = {}, resolve = (table, v) => (resolvers[table] ||= makeResolver(table))(v);
  const skipDupes = $("#skipDupes")?.checked, mkClients = $("#mkClients")?.checked;
  const out = [], seen = new Set(); let skipped = 0, newClients = 0, newStaff = 0;
  for (const r of body) {
    const rec = {}, unmatched = [];
    for (const f of Object.values(F)) if (f.default !== undefined) rec[f.key] = f.default;
    for (const { col, key } of map) {
      const v = (r[col] ?? "").trim(); if (v === "") continue;
      const f = F[key];
      if (key === "_full_name") { const parts = v.includes(",") ? v.split(",").map(s => s.trim()).reverse() : v.split(/\s+/); rec.first_name = rec.first_name || parts[0]; rec.last_name = rec.last_name || parts.slice(1).join(" "); }
      else if (key === "_service") {
        rec.services = rec.services || [];
        for (const name of v.split(/[;,+|]/).map(s => s.trim()).filter(Boolean)) { const id = resolve("services", name); if (id) rec.services.push({ service_id: id }); else unmatched.push("Service: " + name); }
      }
      else if (f.type === "number") { const n = parseFloat(v.replace(/[^0-9.\-]/g, "")); if (!isNaN(n)) rec[key] = n; }
      else if (f.type === "checkbox") rec[key] = truthy(v);
      else if (f.type === "date") rec[key] = toIsoDate(v);
      else if (f.type === "time") rec[key] = toTime(v);
      else if (f.type === "select") { const o = matchOption(f.options, v); if (o) rec[key] = o; else unmatched.push(`${f.label}: ${v}`); }
      else if (f.type === "ref" || f.type === "refsearch") {
        let id = resolve(f.ref, v);
        if (!id && f.ref === "clients" && mkClients) {
          const isPhone = digits(v).length >= 10, parts = v.split(/\s+/);
          id = DB.upsert("clients", isPhone ? { first_name: "Imported client", phone: v } : { first_name: parts[0], last_name: parts.slice(1).join(" ") });
          resolvers.clients = null; newClients++;
        }
        if (!id && f.ref === "staff" && t === "appointments") {
          const parts = v.split(/\s+/);
          id = DB.upsert("staff", { first_name: parts[0], last_name: parts.slice(1).join(" "), active: false, notes: "Added automatically while importing appointment history." });
          resolvers.staff = null; newStaff++;
        }
        if (id) rec[key] = id; else unmatched.push(`${f.label}: ${v}`);
      }
      else rec[key] = v;
    }
    if (t === "appointments" && rec.date && !rec.start_time && /\d:\d/.test(r.join(" "))) {
      const dateCol = map.find(m => m.key === "date"); if (dateCol) rec.start_time = toTime(r[dateCol.col].split(/\s+/).slice(1).join(" "));
    }
    if (unmatched.length) rec.notes = [rec.notes, "(Imported: " + unmatched.join("; ") + ")"].filter(Boolean).join("\n");
    const req = Object.values(F).filter(f => f.required).map(f => f.key);
    if (req.some(k => rec[k] === "" || rec[k] == null)) { skipped++; continue; }
    if (t === "clients" && skipDupes) {
      const k = phoneKey(rec.phone) || (rec.email || "").toLowerCase();
      if (findClientDupe(rec) || (k && seen.has(k))) { skipped++; continue; }
      if (k) seen.add(k);
    }
    if (t === "appointments") { if (!rec.status) rec.status = rec.date < today() ? "Completed" : "Booked"; rec.booked_via = rec.booked_via || "Imported"; prepareAppointment(rec); }
    if (SCHEMA[t].beforeSave && t !== "appointments") SCHEMA[t].beforeSave(rec, {});
    out.push(rec);
  }
  DB.bulkInsert(t, out);
  closeSheet(); tab = t === "appointments" ? "calendar" : t; render();
  toast(`Imported ${out.length}${skipped ? `, skipped ${skipped}` : ""}${newClients ? `, ${newClients} new clients` : ""}${newStaff ? `, ${newStaff} past stylists` : ""}`);
}

function exportCsv(t) {
  const fields = SCHEMA[t].fields.filter(f => f.key);
  const rows = DB.list(t).sort(SCHEMA[t].sort);
  if (!rows.length) return toast("Nothing to export yet");
  const cell = (f, r) => {
    const v = r[f.key];
    if (f.type === "ref" || f.type === "refsearch") { const x = DB.get(f.ref, v); return x ? SCHEMA[f.ref].title(x) : ""; }
    if (f.type === "checkbox") return v ? "Yes" : "No";
    if (f.type === "services_offered") return (v || []).map(o => { const s = DB.get("services", o.service_id); if (!s) return ""; return s.name + (o.price !== "" && o.price != null ? ` ${money(o.price)}` : ""); }).filter(Boolean).join("; ");
    if (f.type === "weekly_hours") return DAYS.filter(([d]) => v?.[d]?.on).map(([d, n]) => `${n} ${v[d].start}-${v[d].end}`).join("; ");
    if (f.type === "repeater") return (v || []).map(o => Object.entries(o).map(([k, x]) => k === "service_id" ? DB.get("services", x)?.name : x).filter(x => x !== "" && x != null).join(" ")).join("; ");
    return v ?? "";
  };
  const extra = t === "appointments" ? [["End time", r => r.end_time], ["Minutes", r => r.duration_min]] : [];
  download(`${t}-${today()}.csv`, toCsv([["id", ...fields.map(f => f.label), ...extra.map(e => e[0])], ...rows.map(r => [r.id, ...fields.map(f => cell(f, r)), ...extra.map(e => e[1](r) ?? "")])]), "text/csv");
}

render();
</script>
</body>
</html>
