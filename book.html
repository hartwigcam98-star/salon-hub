<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book an appointment</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#1f1d1a; --muted:#77716a; --line:#e6e1da; --accent:#8a5a44; --accent-ink:#fff; --soft:#f1e7e1; --danger:#b3261e; --radius:14px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --card:#1f1d1a; --ink:#f1ede7; --muted:#a29a90; --line:#34302b; --accent:#c98b6b; --accent-ink:#151412; --soft:#2c2420; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 18px) 16px 120px; }
  header .name { font-size:26px; font-weight:800; letter-spacing:-.01em; }
  header .meta { color:var(--muted); font-size:14px; margin-top:2px; }
  .steps { display:flex; gap:6px; margin:18px 0 6px; }
  .steps i { flex:1; height:4px; border-radius:4px; background:var(--line); }
  .steps i.on { background:var(--accent); }
  h2 { font-size:20px; margin:16px 0 10px; }
  .cat { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
  .opt { background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:8px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .opt.sel { border-color:var(--accent); background:var(--soft); }
  .opt .tick { width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line); flex:none; display:grid; place-items:center; font-size:14px; color:var(--accent-ink); margin-top:1px; }
  .opt.sel .tick { background:var(--accent); border-color:var(--accent); }
  .opt.radio .tick { border-radius:50%; }
  .opt .body { flex:1; min-width:0; }
  .opt .t { font-weight:650; }
  .opt .d { color:var(--muted); font-size:14px; }
  .opt .p { font-weight:650; white-space:nowrap; }
  .avatar { width:44px; height:44px; border-radius:50%; flex:none; background:var(--line) center/cover; display:grid; place-items:center; font-weight:700; color:#fff; }
  .days { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .day { flex:none; width:62px; text-align:center; padding:8px 0; border-radius:12px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; scroll-snap-align:start; }
  .day b { display:block; font-size:20px; }
  .day small { color:var(--muted); font-size:12px; display:block; }
  .day.sel { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
  .day.sel small { color:var(--accent-ink); }
  .day.none { opacity:.38; }
  .times { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .time { padding:12px 0; text-align:center; border-radius:10px; border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-weight:600; }
  .time.sel { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  textarea { min-height:70px; }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:15px; margin:10px 0; }
  .check input { width:auto; transform:scale(1.25); margin-top:4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0; }
  .summary-row { display:flex; justify-content:space-between; gap:10px; padding:4px 0; }
  .muted { color:var(--muted); }
  .small { font-size:14px; }
  .policy { font-size:14px; color:var(--muted); white-space:pre-wrap; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px calc(env(safe-area-inset-bottom) + 12px); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .bar .sum { flex:1; font-size:14px; color:var(--muted); min-width:0; }
  .bar .sum b { color:var(--ink); display:block; font-size:16px; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 18px; cursor:pointer; background:var(--line); color:var(--ink); }
  button.primary { background:var(--accent); color:var(--accent-ink); font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  button.link { background:none; padding:0; color:var(--accent); text-decoration:underline; }
  .back { background:none; padding:6px 0; color:var(--accent); font-weight:600; }
  .err { color:var(--danger); font-size:14px; margin-top:8px; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  a { color:var(--accent); }
  .done { text-align:center; padding-top:20px; }
  .done .big { font-size:54px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="name" id="salonName">Book an appointment</div><div class="meta" id="salonMeta"></div></header>
  <div class="steps" id="steps"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in"><div class="sum" id="barSum"></div><button class="primary" id="barBtn">Continue</button></div></div>

<script>
"use strict";
const SUPABASE_URL = "https://mhgjtsinlvmhhlchbkdd.supabase.co";
const SUPABASE_KEY = "sb_publishable_JhGLHEK9fwKWZuoTgACedA_aYGjB7AT";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const DAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];
let sb, info, S, services, staff, busy = [], busyRange = null;
const state = { step: 0, svc: [], staff: "any", date: null, time: null, slotStaff: null, result: null };

/* ---------- small helpers ---------- */
const money = n => n === "" || n == null || isNaN(+n) ? "" : "$" + (+n).toFixed(+n % 1 ? 2 : 0);
const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
const toHHMM = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const fmtTime = t => { const m = toMin(t), h = Math.floor(m / 60); return `${(h % 12) || 12}:${String(m % 60).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)} hr${m % 60 ? ` ${m % 60} min` : ""}` : `${m} min`;
const dateObj = iso => new Date(iso + "T12:00:00");
const fmtDate = (iso, o) => dateObj(iso).toLocaleDateString(undefined, o || { weekday: "long", month: "long", day: "numeric" });
const addDays = (iso, n) => { const d = dateObj(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const num = v => v === "" || v == null || isNaN(+v) ? null : +v;

// "Now" in the salon's time zone, as "YYYY-MM-DDTHH:MM", optionally shifted by hours.
function salonNow(plusHours = 0) {
  const tz = S.timezone || "America/Chicago";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const ms = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) + plusHours * 3600e3;
  return new Date(ms).toISOString().slice(0, 16);
}
function dayHours(wh, iso) {
  const k = DAY_KEYS[dateObj(iso).getDay()], x = (wh || {})[k] || {};
  if (!(x.on ?? k !== "sun")) return null;
  return [toMin(x.start || "09:00"), toMin(x.end || "17:00")];
}
const offerFor = (st, sid) => (st.services_offered || []).find(o => o.service_id === sid);
const canDo = (st, ids) => ids.every(id => offerFor(st, id));
function lineFor(st, sid) {
  const svc = services.find(s => s.id === sid), o = offerFor(st, sid) || {};
  return { price: num(o.price) ?? num(svc.price) ?? 0, dur: num(o.duration_min) ?? num(svc.duration_min) ?? 30 };
}
const totals = st => state.svc.reduce((a, id) => { const l = lineFor(st, id); return { price: a.price + l.price, dur: a.dur + l.dur }; }, { price: 0, dur: 0 });
const candidates = () => staff.filter(st => canDo(st, state.svc) && (state.staff === "any" || st.id === state.staff));

/* ---------- availability (mirrors the server's rules) ---------- */
function slotsFor(st, iso) {
  if ((S.closures || []).some(c => c.date === iso)) return [];
  const bh = dayHours(S.business_hours, iso), sh = dayHours(st.weekly_hours, iso);
  if (!bh || !sh) return [];
  if ((st.time_off || []).some(t => t.start && t.start <= iso && (t.end || t.start) >= iso)) return [];
  const open = Math.max(bh[0], sh[0]), close = Math.min(bh[1], sh[1]);
  const { dur } = totals(st), step = Math.max(5, num(S.slot_interval) || 15), buf = num(S.buffer_min) || 0;
  const earliest = salonNow(num(S.min_notice_hours) ?? 2);
  const taken = busy.filter(b => b.staff_id === st.id && b.date === iso).map(b => [toMin(b.start), toMin(b.end)]);
  const out = [];
  for (let t = open; t + dur <= close; t += step) {
    if (`${iso}T${toHHMM(t)}` < earliest) continue;
    if (taken.some(([a, b]) => a < t + dur + buf && b + buf > t)) continue;
    out.push(t);
  }
  return out;
}
function slotsForDay(iso) {
  const map = new Map(); // minute -> stylist ids free
  for (const st of candidates()) for (const t of slotsFor(st, iso)) { if (!map.has(t)) map.set(t, []); map.get(t).push(st.id); }
  return [...map.entries()].sort((a, b) => a[0] - b[0]);
}
function pickStylist(ids, iso) {
  // For "no preference": give it to whoever has the fewest bookings that day
  const load = id => busy.filter(b => b.staff_id === id && b.date === iso).length;
  return ids.slice().sort((a, b) => load(a) - load(b))[0];
}
async function loadBusy(force) {
  const from = salonNow().slice(0, 10), to = addDays(from, Math.min(num(S.max_days_ahead) ?? 90, 120));
  if (busyRange && !force) return;
  const chunks = [];
  for (let d = from; d <= to; d = addDays(d, 61)) chunks.push([d, addDays(d, 60) < to ? addDays(d, 60) : to]);
  const res = await Promise.all(chunks.map(([a, b]) => sb.rpc("busy_times", { p_from: a, p_to: b })));
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  busy = res.flatMap(r => r.data || []); busyRange = [from, to];
}

/* ---------- rendering ---------- */
const STEP_NAMES = ["Services", "Stylist", "Time", "Details"];
function setBar(summary, label, enabled, onClick) {
  if (label === null) { $("#bar").style.display = "none"; return; }
  $("#bar").style.display = ""; $("#barSum").innerHTML = summary; $("#barBtn").textContent = label;
  $("#barBtn").disabled = !enabled; $("#barBtn").onclick = onClick;
}
function render() {
  $("#steps").innerHTML = state.step < 4 ? STEP_NAMES.map((_, i) => `<i class="${i <= state.step ? "on" : ""}"></i>`).join("") : "";
  [renderServices, renderStaff, renderTime, renderDetails, renderDone][state.step]();
  window.scrollTo(0, 0);
}
const backBtn = () => `<button class="back" onclick="state.step--;render()">‹ Back</button>`;
function selectionSummary() {
  if (!state.svc.length) return "Choose one or more services";
  const names = state.svc.map(id => services.find(s => s.id === id)?.name).join(", ");
  const sts = candidates(); if (!sts.length) return esc(names);
  const ts = sts.map(totals), lo = Math.min(...ts.map(t => t.price)), hi = Math.max(...ts.map(t => t.price));
  const from = state.svc.some(id => services.find(s => s.id === id)?.price_from);
  return `<b>${from ? "from " : ""}${money(lo)}${hi > lo ? "–" + money(hi) : ""}</b>${esc(names)}`;
}

function renderServices() {
  const offered = services.filter(s => staff.some(st => offerFor(st, s.id)));
  if (!offered.length) { $("#view").innerHTML = `<div class="empty">No services are available to book online yet.${S.phone ? `<br>Please call <a href="tel:${esc(S.phone)}">${esc(S.phone)}</a>.` : ""}</div>`; return setBar("", null); }
  const cats = [...new Set(offered.map(s => s.category || "Services"))];
  $("#view").innerHTML = `<h2>What would you like?</h2>` + cats.map(c => `<div class="cat">${esc(c)}</div>` + offered.filter(s => (s.category || "Services") === c).map(s => `
    <div class="opt${state.svc.includes(s.id) ? " sel" : ""}" data-id="${esc(s.id)}"><div class="tick">✓</div>
      <div class="body"><div class="t">${esc(s.name)}</div><div class="d">${s.duration_min ? fmtDur(+s.duration_min) : ""}${s.description ? " · " + esc(s.description) : ""}</div></div>
      <div class="p">${s.price_from ? "from " : ""}${money(s.price)}</div></div>`).join("")).join("");
  $$(".opt").forEach(el => el.onclick = () => {
    const id = el.dataset.id; state.svc = state.svc.includes(id) ? state.svc.filter(x => x !== id) : [...state.svc, id];
    state.time = null; el.classList.toggle("sel"); updateServiceBar();
  });
  updateServiceBar();
}
function updateServiceBar() {
  const ok = state.svc.length && staff.some(st => canDo(st, state.svc));
  setBar(state.svc.length && !ok ? `<span class="err">No one offers that combination online. Try fewer services.</span>` : selectionSummary(), "Continue", !!ok, () => {
    if (state.staff !== "any" && !canDo(staff.find(s => s.id === state.staff) || {}, state.svc)) state.staff = "any";
    state.step = 1; render();
  });
}

function renderStaff() {
  const able = staff.filter(st => canDo(st, state.svc));
  const av = st => st.photo_url ? `<div class="avatar" style="background-image:url('${esc(st.photo_url)}')"></div>` : `<div class="avatar" style="background:${esc(st.color || "var(--accent)")}">${esc((st.name || "?")[0])}</div>`;
  $("#view").innerHTML = `${backBtn()}<h2>Who would you like to see?</h2>
    ${able.length > 1 ? `<div class="opt radio${state.staff === "any" ? " sel" : ""}" data-id="any"><div class="tick">✓</div><div class="body"><div class="t">No preference</div><div class="d">First available stylist</div></div></div>` : ""}
    ${able.map(st => { const t = totals(st); return `<div class="opt radio${state.staff === st.id ? " sel" : ""}" data-id="${esc(st.id)}">${av(st)}
      <div class="body"><div class="t">${esc(st.name)}</div><div class="d">${[st.level, st.specialties].filter(Boolean).map(esc).join(" · ")}</div>${st.bio ? `<div class="d" style="margin-top:4px">${esc(st.bio)}</div>` : ""}</div>
      <div class="p">${money(t.price)}<div class="d" style="text-align:right">${fmtDur(t.dur)}</div></div></div>`; }).join("")}`;
  if (able.length === 1) state.staff = able[0].id;
  $$(".opt").forEach(el => el.onclick = () => { state.staff = el.dataset.id; state.time = null; $$(".opt").forEach(o => o.classList.toggle("sel", o === el)); setBar(selectionSummary(), "Continue", true, goTime); });
  setBar(selectionSummary(), "Continue", true, goTime);
}
async function goTime() {
  state.step = 2; $("#view").innerHTML = `<div class="empty">Finding open times…</div>`; setBar("", null);
  try { await loadBusy(); } catch (e) { $("#view").innerHTML = `<div class="err">Couldn't load availability. Please refresh and try again.</div>`; return; }
  render();
}

function renderTime() {
  const first = salonNow().slice(0, 10), n = Math.min(num(S.max_days_ahead) ?? 90, 120);
  const days = Array.from({ length: n + 1 }, (_, i) => addDays(first, i));
  const counts = Object.fromEntries(days.map(d => [d, slotsForDay(d).length]));
  if (!state.date || !counts[state.date]) state.date = days.find(d => counts[d]) || first;
  const slots = slotsForDay(state.date);
  const groups = [["Morning", 0, 720], ["Afternoon", 720, 1020], ["Evening", 1020, 1440]];
  $("#view").innerHTML = `${backBtn()}<h2>Pick a time</h2>
    <div class="days" id="days">${days.map(d => `<div class="day${d === state.date ? " sel" : ""}${counts[d] ? "" : " none"}" data-d="${d}">
      <small>${dateObj(d).toLocaleDateString(undefined, { weekday: "short" })}</small><b>${dateObj(d).getDate()}</b><small>${dateObj(d).toLocaleDateString(undefined, { month: "short" })}</small></div>`).join("")}</div>
    <div class="cat">${esc(fmtDate(state.date))}</div>
    ${slots.length ? groups.map(([g, a, b]) => { const s = slots.filter(([t]) => t >= a && t < b); return s.length ? `<div class="muted small" style="margin:12px 0 6px">${g}</div><div class="times">${s.map(([t, ids]) =>
      `<div class="time${state.time === t ? " sel" : ""}" data-t="${t}" data-ids="${ids.join(",")}">${fmtTime(toHHMM(t))}</div>`).join("")}</div>` : ""; }).join("")
    : `<div class="empty">No open times this day.${days.some(d => counts[d]) ? " Try another date." : `<br>Nothing is open online right now${S.phone ? ` — please call <a href="tel:${esc(S.phone)}">${esc(S.phone)}</a>` : ""}.`}</div>`}`;
  $$(".day").forEach(el => el.onclick = () => { state.date = el.dataset.d; state.time = null; renderTime(); });
  $$(".time").forEach(el => el.onclick = () => {
    state.time = +el.dataset.t; state.slotStaff = state.staff === "any" ? pickStylist(el.dataset.ids.split(","), state.date) : state.staff;
    $$(".time").forEach(o => o.classList.toggle("sel", o === el)); timeBar();
  });
  const sel = $(".day.sel"); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
  timeBar();
}
function timeBar() {
  const st = staff.find(s => s.id === state.slotStaff);
  setBar(state.time != null && st ? `<b>${fmtDate(state.date, { weekday: "short", month: "short", day: "numeric" })} · ${fmtTime(toHHMM(state.time))}</b>with ${esc(st.name)}` : "Choose a time", "Continue", state.time != null, () => { state.step = 3; render(); });
}

function renderDetails() {
  const st = staff.find(s => s.id === state.slotStaff), t = totals(st), d = state.form || {};
  const dep = S.deposit_required ? (S.deposit_type === "% of service" ? (t.price * (+S.deposit_amount || 0) / 100) : +S.deposit_amount || 0) : 0;
  const fee = (v, type) => v ? (type === "% of service" ? `${v}% of the service` : money(v)) : "";
  const pol = [S.cancel_window_hours ? `Please give at least ${S.cancel_window_hours} hours' notice to cancel or reschedule.` : "",
    S.late_cancel_fee ? `Late cancellations may be charged ${fee(S.late_cancel_fee, S.late_cancel_fee_type)}.` : "",
    S.no_show_fee ? `No-shows may be charged ${fee(S.no_show_fee, S.no_show_fee_type)}.` : "",
    dep ? `A deposit of ${money(dep)} is required to hold this appointment. The salon will contact you to collect it.` : "",
    S.policy_text || ""].filter(Boolean).join("\n");
  $("#view").innerHTML = `${backBtn()}<h2>Your details</h2>
    <div class="card">${state.svc.map(id => { const s = services.find(x => x.id === id), l = lineFor(st, id); return `<div class="summary-row"><span>${esc(s.name)}</span><span>${s.price_from ? "from " : ""}${money(l.price)}</span></div>`; }).join("")}
      <div class="summary-row muted small"><span>${esc(fmtDate(state.date))} · ${fmtTime(toHHMM(state.time))}–${fmtTime(toHHMM(state.time + t.dur))}</span><span>${esc(st.name)}</span></div></div>
    <form id="f" novalidate>
      <div class="grid2"><div class="field"><label>First name *</label><input name="first_name" autocomplete="given-name" value="${esc(d.first_name)}"></div>
      <div class="field"><label>Last name</label><input name="last_name" autocomplete="family-name" value="${esc(d.last_name)}"></div></div>
      <div class="field"><label>Mobile phone *</label><input name="phone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(d.phone)}"></div>
      <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" value="${esc(d.email)}"></div>
      <div class="field"><label>Anything we should know?</label><textarea name="notes" maxlength="500" placeholder="Hair goals, allergies, inspiration…">${esc(d.notes)}</textarea></div>
      <label class="check"><input type="checkbox" name="sms_opt_in" ${d.sms_opt_in !== false ? "checked" : ""}><span>Text me appointment reminders</span></label>
      ${pol ? `<div class="card"><div class="cat" style="margin-top:0">Salon policies</div><div class="policy">${esc(pol)}</div>
        <label class="check"><input type="checkbox" name="agree"><span>I agree to the salon's policies</span></label></div>` : ""}
      <div class="err" id="err"></div>
    </form>`;
  setBar(`<b>${money(t.price)}</b>${fmtDur(t.dur)} · pay at the salon`, "Book appointment", true, submit);
}
async function submit() {
  const f = $("#f"), v = n => (f.elements[n]?.value || "").trim();
  state.form = { first_name: v("first_name"), last_name: v("last_name"), phone: v("phone"), email: v("email"), notes: v("notes"), sms_opt_in: f.elements.sms_opt_in.checked };
  const err = m => { $("#err").textContent = m; $("#err").scrollIntoView({ block: "center" }); };
  if (!state.form.first_name) return err("Please enter your first name.");
  if (state.form.phone.replace(/\D/g, "").length < 10) return err("Please enter a valid mobile number.");
  if (state.form.email && !/.+@.+\..+/.test(state.form.email)) return err("Please check your email address.");
  if (f.elements.agree && !f.elements.agree.checked) return err("Please agree to the salon's policies.");
  $("#barBtn").disabled = true; $("#barBtn").textContent = "Booking…";
  const { data, error } = await sb.rpc("book_appointment", { p: { ...state.form, staff_id: state.slotStaff, service_ids: state.svc, date: state.date, start_time: toHHMM(state.time) } });
  if (error) {
    $("#barBtn").disabled = false; $("#barBtn").textContent = "Book appointment";
    if (/taken|working|away|closed|soon|outside/i.test(error.message)) {
      await loadBusy(true); state.time = null; state.step = 2; render();
      const n = document.createElement("div"); n.className = "err"; n.textContent = error.message; $("#view").prepend(n); return;
    }
    return err(error.message || "Something went wrong. Please try again or call the salon.");
  }
  state.result = data; state.step = 4; render();
}

function renderDone() {
  const r = state.result, st = staff.find(s => s.id === state.slotStaff);
  const addr = [S.address, S.city, S.state, S.zip].filter(Boolean).join(", ");
  $("#view").innerHTML = `<div class="done"><div class="big">✨</div><h2>You're booked!</h2>
    <p class="muted">See you ${esc(fmtDate(r.date))} at ${fmtTime(r.start_time)}.</p></div>
    <div class="card">${state.svc.map(id => `<div class="summary-row"><span>${esc(services.find(x => x.id === id).name)}</span></div>`).join("")}
      <div class="summary-row muted small"><span>${fmtTime(r.start_time)}–${fmtTime(r.end_time)} with ${esc(st.name)}</span><span>${money(r.total_price)}</span></div>
      ${addr ? `<div class="summary-row small"><a href="https://maps.google.com/?q=${encodeURIComponent(addr)}" target="_blank" rel="noopener">${esc(addr)}</a></div>` : ""}
      ${S.phone ? `<div class="summary-row small"><span>Need to change it? Call <a href="tel:${esc(S.phone)}">${esc(S.phone)}</a></span></div>` : ""}</div>
    <button style="width:100%" id="ics">Add to my calendar</button>
    <p style="text-align:center"><button class="link" onclick="location.reload()">Book another appointment</button></p>`;
  setBar("", null);
  $("#ics").onclick = () => {
    const dt = (d, t) => d.replace(/-/g, "") + "T" + t.replace(":", "") + "00";
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Salon Hub//EN", "BEGIN:VEVENT", `UID:${r.id}@salonhub`,
      `DTSTART:${dt(r.date, r.start_time)}`, `DTEND:${dt(r.date, r.end_time)}`,
      `SUMMARY:${(S.salon_name || "Salon")} – ${state.svc.map(id => services.find(x => x.id === id).name).join(", ")}`.replace(/[,;]/g, m => "\\" + m),
      addr ? `LOCATION:${addr.replace(/[,;]/g, m => "\\" + m)}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "appointment.ics"; a.click();
  };
}

/* ---------- start ---------- */
(async function start() {
  const fail = msg => { $("#view").innerHTML = `<div class="empty">${msg}</div>`; };
  if (!window.supabase?.createClient) return fail("Can't connect right now. Please check your internet and refresh.");
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  const { data, error } = await sb.rpc("booking_info");
  if (error || !data) return fail("Online booking isn't set up yet.");
  info = data; S = info.settings || {}; services = info.services || []; staff = (info.staff || []).filter(s => (s.services_offered || []).length);
  if (S.salon_name) { $("#salonName").textContent = S.salon_name; document.title = `Book · ${S.salon_name}`; }
  $("#salonMeta").innerHTML = [[S.city, S.state].filter(Boolean).join(", "), S.phone ? `<a href="tel:${esc(S.phone)}" style="color:inherit">${esc(S.phone)}</a>` : ""].filter(Boolean).map(x => x.startsWith("<") ? x : esc(x)).join(" · ");
  if (!S.online_booking) return fail(`Online booking isn't open yet.${S.phone ? `<br>Please call <a href="tel:${esc(S.phone)}">${esc(S.phone)}</a> to book.` : ""}`);
  const pre = new URLSearchParams(location.search).get("stylist");
  if (pre && staff.some(s => s.id === pre)) state.staff = pre;
  render();
})();
</script>
</body>
</html>
